<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lisää vaate</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Oma CSS -->
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>

<body>
    <h1>VARASTONSEURANTAJÄRJESTELMÄ</h1>

    <div>
        <a th:href="@{/index}"> <button type="button"> Peruuta </button></a>
    </div>

    <h4>Lisää vaate</h4>

    <!--formi vaatteen lisäämiseksi-->
    <form method="post" action="#" th:action="@{/saveclothing}" th:object="${clothing}">

        <!-- Vaatteen nimi -->
        <div>
            <label for="">Vaatteen nimi: </label>
            <input type="text" th:field="*{name}" placeholder="Tuotteen nimi">
            <div th:if="${#fields.hasErrors('name')}" th:errors="*{name}" style="color: red;"></div>
        </div>

        <!-- Vaatteen koko -->
        <div>
            <label for="">Vaatteen koko: </label>
            <select th:field="*{clothingSize}">
                <option value="">Valitse koko</option>
                <option th:each="size : ${sizes}" th:value="${size}" th:text="${size}"></option>
            </select>
        </div>

        <!-- Väri -->
        <div>
            <label for="">Väri: </label>
            <input type="text" th:field="*{color}" placeholder="Väri">
        </div>

        <!-- Hinta -->
        <div>
            <label for="">Hinta: </label>
            <input type="text" th:field="*{price}" placeholder="Hinta">
            <div th:if="${#fields.hasErrors('price')}" th:errors="*{price}"></div>
        </div>

        <!-- Valmistaja -->
        <div>
            <label for="">Valmistaja: </label>
            <select th:field="*{manufacturer}">
                <option value="">Valitse valmistaja</option>
                <option th:each="m : ${manufacturers}" th:value="${m.manufacturerId}" th:text="${m.mname}">
                </option>
            </select>
        </div>

        <button type="submit">Lisää tuote</button>

    </form>

</body>

</html>
