<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lisää ruoka</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Averia+Libre:ital,wght@0,300;0,400;0,700;1,300;1,400;1,700&family=Cabin+Sketch:wght@400;700&display=swap"
        rel="stylesheet">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Oma CSS -->
    <link rel="stylesheet" th:href="@{/styles.css}">

</head>

<body>
    <!-- Header -->
    <div class="header">
        <h1> VARASTONSEURANTAJÄRJESTELMÄ </h1>

        <div class="header-user">
            <h3>Olet kirjautunut <span sec:authentication="name" class="username-color"></span> käyttäjänä.</h3>
            <form th:action="@{/logout}" method="post">
                <input class="btn btn-sm" type="submit" value="Kirjaudu Ulos">
            </form>
        </div>
    </div>

    <!-- Formi -->
    <div class="form-container">
        <div class="header-form">
            <h4>Lisää ruoka</h4>
            <a th:href="@{/index}"> <button class="btn btn-sm" type="button"> Etusivulle </button></a>
        </div>

        <!-- formi ruuan lisäämiseksi -->
        <form method="post" action="#" th:action="@{/savefood}" th:object="${food}">

            <!-- Ruoan nimi -->
            <div class="form-group">
                <label for="">Ruoan nimi: </label>
                <input class="form-control input-add" type="text" th:field="*{name}" placeholder="Tuotteen nimi">
                <div th:if="${#fields.hasErrors('name')}" th:errors="*{name}" style="color: red;"></div>
            </div>

            <!-- Ruoan hinta -->
            <div class="form-group">
                <label for="">Hinta: </label>
                <input class="form-control input-add" type="text" th:field="*{price}" placeholder="Hinta">
                <div th:if="${#fields.hasErrors('price')}" th:errors="*{price}"></div>
            </div>

            <!-- Ruoan valmistaja -->
            <div class="form-group">
                <label for="">Valmistaja: </label>
                <select class="form-select form-control select-add" th:field="*{manufacturer}">
                    <option value="">Valitse valmistaja</option>
                    <option th:each="m : ${manufacturers}" th:value="${m.manufacturerId}" th:text="${m.mname}">
                    </option>
                </select>
            </div>

            <!-- Ruoan tyyppi -->
            <div class="form-group">
                <label for=""> Ruoan tyyppi: </label>
                <select class="form-select form-control select-add" th:field="*{foodType}">
                    <option value="">Valitse ruoan tyyppi</option>
                    <option th:each="ftype : ${foodtype}" th:value="${ftype}" th:text="${ftype}"></option>
                </select>
            </div>

            <!-- Koiran ikä -->
            <div class="form-group">
                <label for="">Koiran ikä: </label>
                <select class="form-select form-control select-add" th:field="*{dogAge}">
                    <option value="">Valitse koiran ikä</option>
                    <option th:each="age : ${dogage}" th:value="${age}" th:text="${age}"></option>
                </select>
            </div>

            <!-- Tallenna & Peruuta -->
            <button class="btn btn-sm" type="submit">Lisää ruoka</button>
            <a th:href="@{/index}"> <button class="btn btn-sm" type="button"> Peruuta </button></a>

        </form>


</body>

</html>
