<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
  xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tuotelistaus</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Averia+Libre:ital,wght@0,300;0,400;0,700;1,300;1,400;1,700&family=Cabin+Sketch:wght@400;700&display=swap"
    rel="stylesheet">

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Oma CSS -->
  <link rel="stylesheet" th:href="@{/styles.css}">

</head>

<body>

  <!-- Header -->
  <div class="header">
    <h1> VARASTONSEURANTAJÄRJESTELMÄ </h1>

    <div class="header-user">
      <h3>Olet kirjautunut <span sec:authentication="name" class="username-color"></span> käyttäjänä.</h3>
      <form th:action="@{/logout}" method="post">
        <input class="btn btn-sm" type="submit" value="Kirjaudu Ulos">
      </form>
    </div>
  </div>

  <!-- Kaikki tuotteet + Valmistajat -->
  <div class="container">
    <div class="div-margin">
      <a th:href="@{/allproducts}"><button class="btn btn-sm" type="button">Kaikki tuotteet</button></a>
      <a th:href="@{/manufacturerlist}"><button class="btn btn-sm" type="button">Valmistajatiedot</button> </a>
    </div>

    <!-- Sarakkeet: eri tuotteiden sivuille -->
    <div class="row">
      <div class="col-md-4 div-margin">
        <!-- ruokatuotteen tiedot -->
        <h4>Ruoat</h4>
        <a th:href="@{/foodlist}"> <button class="btn btn-sm" type="button">Lista ruoista</button></a>
        <span sec:authorize="hasAuthority('ADMIN')">
          <!--vain ADMIN -käyttäjä voi lisätä uuden tuotteen-->
          <a th:href="@{/addfood}"><button class="btn btn-sm" type="button">Lisää ruoka</button></a>
        </span>
      </div>

      <div class="col-md-4 div-margin">
        <!-- vaatetuotteen tiedot -->
        <h4>Vaatteet</h4>
        <a th:href="@{/clothinglist}"> <button class="btn btn-sm" type="button">Lista vaatteista</button></a>
        <span sec:authorize="hasAuthority('ADMIN')">
          <a th:href="@{/addclothing}"><button class="btn btn-sm" type="button">Lisää vaate</button></a>
        </span>
      </div>

      <div class="col-md-4 div-margin">
        <!-- lelutuotteen tiedot -->
        <h4>Lelut</h4>
        <a th:href="@{/toylist}"> <button class="btn btn-sm" type="button">Lista leluista</button></a>
        <span sec:authorize="hasAuthority('ADMIN')">
          <a th:href="@{/addtoy}"><button class="btn btn-sm" type="button">Lisää lelu</button></a>
        </span>
      </div>

    </div>
  </div>


</body>

</html>
