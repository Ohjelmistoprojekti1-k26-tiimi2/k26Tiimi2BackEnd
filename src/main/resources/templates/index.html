<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
  xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tuotelistaus</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Averia+Libre:ital,wght@0,300;0,400;0,700;1,300;1,400;1,700&family=Cabin+Sketch:wght@400;700&display=swap"
    rel="stylesheet">

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Oma CSS -->
  <link rel="stylesheet" th:href="@{/styles.css}">
</head>

<body>
  <h1 class="header"> VARASTONSEURANTAJÄRJESTELMÄ </h1>

  <div>
    <h3>You are signed in as <span sec:authentication="name"></span>.</h3>
    <form th:action="@{/logout}" method="post">
      <input type="submit" value="Sign Out">
    </form>
    <br>
  </div>

  <div class="container">
    <div class="col-md-4">
      <a th:href="@{/allproducts}"><button type="button">Kaikki tuotteet</button></a>
      <a th:href="@{/manufacturerlist}"><button type="button">Valmistajatiedot</button> </a>
      <br>
    </div>

    <div class="row">
      <div class="col-md-4 card">
        <!-- ruokatuotteen tiedot -->
        <h4>Ruuat</h4>
        <a th:href="@{/foodlist}"> <button class="btn" type="button">Lista ruuista</button></a>
        <div sec:authorize="hasAuthority('ADMIN')">
          <!--vain ADMIN -käyttäjä voi lisätä uuden tuotteen-->
          <a th:href="@{/addfood}"><button class="btn" type="button">Lisää ruoka</button></a>
        </div>
      </div>

      <div class="col-md-4 card">
        <!-- vaatetuotteen tiedot -->
        <h4>Vaatteet</h4>
        <a th:href="@{/clothinglist}"> <button class="btn" type="button">Lista vaatteista</button></a>
        <div sec:authorize="hasAuthority('ADMIN')">
          <a th:href="@{/addclothing}"><button class="btn" type="button">Lisää vaate</button></a>
        </div>
      </div>

      <div class="col-md-4 card">
        <!-- lelutuotteen tiedot -->
        <h4>Lelut</h4>
        <a th:href="@{/toylist}"> <button class="btn" type="button">Lista leluista</button></a>
        <div sec:authorize="hasAuthority('ADMIN')">
          <a th:href="@{/addtoy}"><button class="btn" type="button">Lisää lelu</button></a>
        </div>
      </div>

    </div>
  </div>


</body>

</html>
