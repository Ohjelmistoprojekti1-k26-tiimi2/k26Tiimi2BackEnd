<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tuotelistaus</title>
</head>

<body>
  <h1> VARASTONSEURANTAJÄRJESTELMÄ </h1>

  <div>
    <a th:href="@{/addproduct}"><button type="button">Lisää tuote </button></a>
    <a th:href="@{/manufacturerlist}"><button type="button">Valmistajatiedot</button> </a>
    <br>
  </div>

  <div> <!-- ruokatuotteen tiedot -->
    <h4>Ruuat</h4>
    <a th:href="@{/foodlist}"> <button type="button">Lista ruuista</button></a>
    <a th:href="@{/addfood}"><button type="button">Lisää ruoka</button></a>
  </div>

  <div> <!-- vaatetuotteen tiedot -->
    <h4>Vaatteet</h4>
    <a th:href="@{/clothinglist}"> <button type="button">Lista vaatteista</button></a>
    <a th:href="@{/addclothing}"><button type="button">Lisää vaate</button></a>
  </div>

  <div> <!-- lelutuotteen tiedot -->
    <h4>Lelut</h4>
    <a th:href="@{/toylist}"> <button type="button">Lista leluista</button></a>
    <a th:href="@{/addtoy}"><button type="button">Lisää lelu</button></a>
  </div>


</body>

</html>
