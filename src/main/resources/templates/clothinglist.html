<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista vaatteista</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Averia+Libre:ital,wght@0,300;0,400;0,700;1,300;1,400;1,700&family=Cabin+Sketch:wght@400;700&display=swap"
        rel="stylesheet">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Oma CSS -->
    <link rel="stylesheet" th:href="@{/styles.css}">

</head>

<body>
    <!-- Header -->
    <div class="header">
        <h1> VARASTONSEURANTAJÄRJESTELMÄ </h1>

        <div class="header-user">
            <h3>Olet kirjautunut <span sec:authentication="name" class="username-color"></span> käyttäjänä.</h3>
            <form th:action="@{/logout}" method="post">
                <input class="btn btn-sm" type="submit" value="Kirjaudu Ulos">
            </form>
        </div>
    </div>

    <!-- Listaus vaattesita -->

    <div class="container">
        <div class="header-list">
            <div class="back-button">
                <a th:href="@{/index}">
                    <button class="btn btn-sm" type="button"> Etusivulle </button>
                </a>
            </div>

            <h3>Vaatteet</h3>
        </div>

        <!-- Table -->
        <table class="table">
            <tr>
                <th>Nimi</th>
                <th>Hinta (€)</th>
                <th>Valmistaja</th>
                <!-- <th>Tuotetyyppi</th> -->
                <th>Koko</th>
                <th>Väri</th>
                <th sec:authorize="hasAuthority ('ADMIN')"></th>
                <th sec:authorize="hasAuthority ('ADMIN')"></th>
            </tr>

            <tr th:each="clothing : ${clothes}">
                <td th:text="${clothing.name}"></td>
                <td th:text="${clothing.price}"></td>
                <td th:text="${clothing.manufacturer} != null ? ${clothing.manufacturer.mname} : '' "></td>
                <!-- <td th:text="${clothing.productType}"></td> -->
                <td th:text="${clothing.clothingSize}"></td>
                <td th:text="${clothing.color}"></td>

                <!--muokkausnäppäin ADMIN -käyttäjälle-->
                <td sec:authorize="hasAuthority ('ADMIN')">
                    <a th:href="@{/editclothing/{id}(id=${clothing.productId})}">
                        <button class="btn btn-sm" type="button">Muokkaa</button>
                    </a>
                </td>

                <!-- poistonäppäin -->
                <td sec:authorize="hasAuthority ('ADMIN')">
                    <a th:href="@{/deleteproduct/{id}(id=${clothing.productId}, redirect='clothing')}"
                        th:attr="data-name=${clothing.name}"
                        onclick="return confirm('Poistetaanko vaate: ' + this.dataset.name + '?');">
                        <button class="btn btn-sm" type="button">Poista</button>
                    </a>
                </td>
            </tr>
        </table>
    </div>
</body>

</html>
