<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
    xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista valmistajista</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Averia+Libre:ital,wght@0,300;0,400;0,700;1,300;1,400;1,700&family=Cabin+Sketch:wght@400;700&display=swap"
        rel="stylesheet">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Oma CSS -->
    <link rel="stylesheet" th:href="@{/styles.css}">

</head>

<body>
    <!-- Header -->
    <div class="header">
        <h1> VARASTONSEURANTAJÄRJESTELMÄ </h1>

        <div class="header-user">
            <h3>Olet kirjautunut <span sec:authentication="name" class="username-color"></span> käyttäjänä.</h3>
            <form th:action="@{/logout}" method="post">
                <input class="btn btn-sm" type="submit" value="Kirjaudu Ulos">
            </form>
        </div>
    </div>

    <!-- Valmistajan lisäys ADMIN -->
    <div class="form-container">
        <div class="header-form">
            <!--vain ADMIN -käyttäjällä on oikeus lisätä uusia valmistajatietoja-->
            <div sec:authorize="hasAuthority('ADMIN')">
                <h4>Lisää valmistaja</h4>
                <!-- uuden valmistajatiedon lisäys -->
                <form th:action="@{/savemanufacturer}" th:object="${manufacturer}" method="post">
                    <div>
                        <label for="">Valmistajan nimitieto: </label>
                        <br>
                        <input type="text" th:field="*{mname}" placeholder="Valmistaja" />
                        <button class="btn btn-sm" type="submit">Lisää valmistaja</button>
                        <!--validointi-->
                        <div th:if="${#fields.hasErrors('mname')}" th:errors="*{mname}" style="color: red;">
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Listaus valmistajista + Etusivulle nappula -->
    <div class="container" style="margin-top: 45px;">
        <div class="header-list table-manuf">
            <div class="back-button">
                <a th:href="@{/index}">
                    <button class="btn btn-sm" type="button"> Etusivulle </button>
                </a>
            </div>

            <h3>Vaatteet</h3>
        </div>

        <!-- Table -->
        <table class="table table-manuf">
            <tr>
                <th>Nimi</th>
                <th sec:authorize="hasAuthority ('ADMIN')"></th>
                <th sec:authorize="hasAuthority ('ADMIN')"></th>
            </tr>
            <tr th:each="manufacturer : ${manufacturers}">
                <td th:text="${manufacturer.mname}"></td>

                <!--muokkaustoiminto ADMIN -käyttäjälle-->
                <td sec:authorize="hasAuthority ('ADMIN')">
                    <a th:href="@{/editmanufacturer/{id} (id=${manufacturer.manufacturerId})}">
                        <button class="btn btn-sm" type="button">Muokkaa</button>
                    </a>
                </td>

                <!--poistotoiminto ADMIN -käyttäjälle-->
                <td sec:authorize="hasAuthority ('ADMIN')">
                    <a th:href="@{/deletemanufacturer/{id}(id=${manufacturer.manufacturerId})}"
                        th:attr="data-name=${manufacturer.mname}"
                        onclick="return confirm('Poistetaanko valmistaja: ' + this.dataset.name + '?');">
                        <button class="btn btn-sm" type="button">Poista</button>
                    </a>
                </td>

            </tr>
        </table>

    </div>
</body>

</html>
