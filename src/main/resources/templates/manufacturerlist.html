<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista valmistajista</title>
</head>

<body>
    <h1> VARASTONSEURANTAJÄRJESTELMÄ </h1>

    <a th:href="@{/index}"> <button type="button">Etusivulle</button></a>

    <div>
        <h4>Lisää valmistaja</h4>
        <!-- uuden valmistajatiedon lisäys -->
        <form th:action="@{/savemanufacturer}" th:object="${manufacturer}" method="post">
            <div>
                <label for="">Valmistajan nimitieto: </label>
                <br>
                <input type="text" th:field="*{mname}" placeholder="Valmistaja" />
                <button type="submit">Lisää valmistaja</button>
                <!--validointi-->
                <div th:if="${#fields.hasErrors('mname')}" th:errors="*{mname}" style="color: red;"></div>

            </div>
        </form>
    </div>
    <div>
        <h4>Lista valmistajista</h4>
        <table>
            <tr>
                <th>Nimi</th>
            </tr>
            <tr th:each="manufacturer : ${manufacturers}">
                <td th:text="${manufacturer.mname}"></td>
                <!--muokkaustoiminto-->
                <td><a th:href="@{/editmanufacturer/{id} (id=${manufacturer.manufacturerId})}"> <button
                            type="button">Muokkaa</button></a></td>
                <!--poistotoiminto-->
                <td><a th:href="@{/deletemanufacturer/{id}(id=${manufacturer.manufacturerId})}"><button
                            type="button">Poista</button></a></td>
            </tr>
        </table>
    </div>
</body>

</html>
