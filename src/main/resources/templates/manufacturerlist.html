<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista valmistajista</title>
</head>

<body>
    <h4>Lista valmistajista</h4>
    <table>
        <tr>
            <th>Nimi</th>
        </tr>
        <tr th:each="manufacturer : ${manufacturers}">
            <td th:text="${manufacturer.mname}"></td>
        </tr>
    </table>
    <br>
    <a th:href="@{/index}"> Etusivulle </a>

</body>

</html>
