<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valmistajatieto</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Averia+Libre:ital,wght@0,300;0,400;0,700;1,300;1,400;1,700&family=Cabin+Sketch:wght@400;700&display=swap"
        rel="stylesheet">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Oma CSS -->
    <link rel="stylesheet" th:href="@{/styles.css}">

</head>

<body>
    <!-- Header -->
    <div class="header">
        <h1> VARASTONSEURANTAJÄRJESTELMÄ </h1>

        <div class="header-user">
            <h3>Olet kirjautunut <span sec:authentication="name" class="username-color"></span> käyttäjänä.</h3>
            <form th:action="@{/logout}" method="post">
                <input class="btn btn-sm" type="submit" value="Kirjaudu Ulos">
            </form>
        </div>
    </div>

    <!-- Formi -->

    <div class="form-container">
        <div class="header-form">
            <h4>Muokkaa valmistajaa</h4>
            <a th:href="@{/index}"> <button class="btn btn-sm" type="button"> Etusivulle </button></a>
        </div>

        <!-- uuden valmistajatiedon lisäys -->
        <form th:action="@{/editmanufacturer}" th:object="${manufacturer}" method="post">
            <div>
                <label for="">Valmistajan nimitieto: </label>
                <br>
                <input type="hidden" th:field="${manufacturer.manufacturerId}">
                <input type="text" th:field="${manufacturer.mname}" placeholder="Valmistaja" />

                <!-- Tallenna & Peruuta -->
                <button class="btn btn-sm" type="submit">Tallenna</button>
                <a th:href="@{/manufacturerlist}"><button class="btn btn-sm" type="button"> Peruuta </button></a>

            </div>
        </form>

</body>

</html>
