<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Muokkaa tuotetta</title>
</head>

<body>
    <h1> VARASTONSEURANTAJÄRJESTELMÄ </h1>

    <div>
        <a th:href="@{/foodlist}"> <button type="button"> Peruuta </button></a>
        <a th:href="@{/index}"> <button type="button"> Etusivulle </button></a>
    </div>

    <h4>Muokkaa tuotetta</h4>

    <form method="post" action="#" th:action="@{/savefood}" th:object="${food}">

        <input type="hidden" th:field="*{productId}" />

        <!-- Ruoan nimi -->
        <div>
            <label for=""> Ruoan nimi: </label>
            <input type="text" th:field="*{name}" placeholder="Nimi">
        </div>

        <!-- Ruoan tyyppi -->
        <div>
            <label for=""> Ruoan tyyppi: </label>
            <select th:field="*{foodType}">
                <option value="">Valitse ruoan tyyppi</option>
                <option th:each="ftype : ${foodtype}" th:value="${ftype}" th:text="${ftype}"></option>
            </select>
        </div>

        <!-- Koiran ikä -->
        <div>
            <label for="">Koiran ikä: </label>
            <select th:field="*{dogAge}">
                <option value="">Valitse koiran ikä</option>
                <option th:each="age : ${dogage}" th:value="${age}" th:text="${age}"></option>
            </select>
        </div>

        <!-- Ruoan hinta -->
        <div>
            <label for="">Hinta: </label>
            <input type="text" th:field="*{price}" placeholder="Hinta">
        </div>

        <!-- Ruoan valmistaja -->
        <div class="col">
            <label for="">Valmistaja: </label>
            <select id="manufacturerlist" th:field="*{manufacturer}" class="form-select">
                <option value="">Valitse valmistaja</option>
                <option th:each="manufacturer : ${manufacturers}" th:value="${manufacturer.manufacturerId}"
                    th:text="${manufacturer.mname}">
                </option>
            </select>
        </div>

        <button type="submit">Tallenna</button>

    </form>

</body>

</html>
