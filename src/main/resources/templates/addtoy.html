<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lisää lelu</title>
</head>

<body>
    <h1>VARASTONSEURANTAJÄRJESTELMÄ</h1>

    <div>
        <a th:href="@{/index}"> <button type="button"> Peruuta </button></a>
    </div>

    <h4>Lisää lelu</h4>

    <!--formi lelun lisäämiseksi-->
    <form method="post" action="#" th:action="@{/savetoy}" th:object="${toy}">

        <!-- Lelun nimi -->
        <div>
            <label for="">Lelun nimi: </label>
            <input type="text" th:field="*{name}" placeholder="Lelun nimi">
            <div th:if="${#fields.hasErrors('name')}" th:errors="*{name}" style="color: red;"></div>
        </div>

        <!-- Lelun tyyppi -->
        <div>
            <label for="">Lelun tyyppi: </label>
            <select th:field="*{toyType}">
                <option value="">Valitsen lelun tyyppi</option>
                <option th:each="ttype : ${toytypes}" th:value="${ttype}" th:text="${ttype}"></option>
            </select>
        </div>

        <!-- Lelun koko -->
        <div>
            <label for="">Lelun koko: </label>
            <select th:field="*{toySize}">
                <option value="">Valitse lelun koko</option>
                <option th:each="size : ${toySizes}" th:value="${size}" th:text="${size}"></option>
            </select>
        </div>

        <!-- Lelun hinta -->
        <div>
            <label for="">Hinta: </label>
            <input type="text" th:field="*{price}" placeholder="Hinta">
            <div th:if="${#fields.hasErrors('price')}" th:errors="*{price}"></div>
        </div>

        <!-- Lelun valmistaja -->
        <div>
            <label for="">Valmistaja: </label>
            <select th:field="*{manufacturer}">
                <option value="">Valitse valmistaja</option>
                <option th:each="m : ${manufacturers}" th:value="${m.manufacturerId}" th:text="${m.mname}">
                </option>
            </select>
        </div>

        <button type="submit">Lisää tuote</button>
    </form>


</body>

</html>
